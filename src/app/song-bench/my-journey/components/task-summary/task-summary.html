<div class="summary-grid">
  @for (item of summaryItems; track item.key) {
    <div class="summary-card {{item.key}}">
      <svg class="summary-icon" width="25" height="24" viewBox="0 0 25 24">
        <rect width="25" height="24" rx="4" [attr.fill]="item.color"/>
        <path d="M6 13.5L10 17L18 9"
              stroke="white" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"
              fill="none"/>
      </svg>
      <div class="label">{{item.label}}</div>
      <div class="count">{{counts()[item.key]}} / {{tasksSignal().length}}</div>
    </div>
  }
</div>
