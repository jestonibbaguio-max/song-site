<header class="header">

<div class="header-brand">

  <img
    src="assets/images/acn-logo.svg"
    alt="ATCP Song Logo"
    class="logo">

  <div class="header-divider"></div>

  <h2>ATCP Song Bench</h2>

</div>

<div class="header-right">
  <nav>
  <a 
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">
    Home
  </a>

  <a 
    routerLink="/aboutus"
    routerLinkActive="active">
    About
  </a>

  <a 
    routerLink="/my-journey"
    routerLinkActive="active">
    Journey
  </a>

  <a 
    routerLink="/announcement"
    routerLinkActive="active">
    Announcement
  </a>

  <a 
    routerLink="/contactus"
    routerLinkActive="active">
    Contact
  </a>

  <a 
    routerLink="/atcp-song-links"
    routerLinkActive="active">
    ATCP Song Links
  </a>

    <div class="nav__search">
      <button class="navbar__search-btn" (click)="toggleSearch()" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- Search input (expands on click) -->
      <div class="nav__search-box" [class.active]="isSearchOpen">
        <input type="text" placeholder="Search..." class="nav__search-input" #searchInput />
      </div>

    </div>

  </nav>

  <div class="profile-dropdown" [class.open]="isProfileOpen">
    <button type="button" class="profile-trigger" (click)="toggleProfile()" aria-label="User profile menu">
      <span class="user-avatar">{{ account() ? userInitials() : 'SSO' }}</span>
      <span class="profile-trigger-label">{{ account() ? displayName() : 'Profile' }}</span>
      <svg class="profile-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="profile-menu">
      <div class="profile-menu-name">{{ account() ? displayName() : 'Signed out' }}</div>
      <div class="profile-menu-email">{{ account() ? userEmail() : 'Use SSO login to sign in' }}</div>
      <button type="button" class="logout-button" (click)="logout()" [disabled]="!account()">Logout</button>
    </div>
  </div>
</div>

</header>
