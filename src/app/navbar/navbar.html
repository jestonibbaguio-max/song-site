<header class="header">
  <h2>ATCP SONG Website</h2>
  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/aboutus">About</a>
    <a href="/my-journey">Journey</a>
    <a routerLink="/announcement">Announcement</a>
    <a routerLink="/contactus">Contact</a>
    <a routerLink="/atcp-song-links">ATCP Song Links</a>
<div class="nav__search">
  <button class="navbar__search-btn" (click)="toggleSearch()" aria-label="Search">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </button>

  <!-- Search input (expands on click) -->
  <div class="nav__search-box" [class.active]="isSearchOpen">
    <input type="text" placeholder="Search..." class="nav__search-input" #searchInput />
  </div>
</div>
</nav>
</header>
