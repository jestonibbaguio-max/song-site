<header class="header">

<div class="header-brand">

  <img
    src="assets/images/acn-logo.svg"
    alt="ATCP Song Logo"
    class="logo">

  <div class="header-divider"></div>

  <h2>ATCP Song Bench</h2>

</div>

<nav>
  <a 
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">
    Home
  </a>

  <a 
    routerLink="/aboutus"
    routerLinkActive="active">
    About
  </a>

  <a 
    routerLink="/my-journey"
    routerLinkActive="active">
    Journey
  </a>

  <a 
    routerLink="/announcement"
    routerLinkActive="active">
    Announcement
  </a>

  <a 
    routerLink="/contactus"
    routerLinkActive="active">
    Contact
  </a>

  <a 
    routerLink="/atcp-song-links"
    routerLinkActive="active">
    ATCP Song Links
  </a>

    <div class="nav__search">
      <button class="navbar__search-btn" (click)="toggleSearch()" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- Search input (expands on click) -->
      <div class="nav__search-box" [class.active]="isSearchOpen">
        <input type="text" placeholder="Search..." class="nav__search-input" #searchInput />
      </div>

    </div>

  </nav>

</header>
