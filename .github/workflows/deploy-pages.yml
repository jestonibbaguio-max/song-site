name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate SSO secrets
        env:
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
        run: |
          set -e
          if [ -z "$VITE_AZURE_REDIRECT_URI" ]; then
            echo "Missing secret: VITE_AZURE_REDIRECT_URI"
            exit 1
          fi
          if [ -z "$VITE_ENTRA_CLIENT_ID" ]; then
            echo "Missing secret: VITE_ENTRA_CLIENT_ID"
            exit 1
          fi
          if [ -z "$VITE_ENTRA_TENANT_ID" ]; then
            echo "Missing secret: VITE_ENTRA_TENANT_ID"
            exit 1
          fi
          normalized_redirect_uri="${VITE_AZURE_REDIRECT_URI%/}/"
          if [ "$normalized_redirect_uri" != "https://jestonibbaguio-max.github.io/song-site/" ]; then
            echo "Invalid VITE_AZURE_REDIRECT_URI. Expected https://jestonibbaguio-max.github.io/song-site/ (trailing slash optional)"
            exit 1
          fi

      - name: Build app
        env:
          VITE_AZURE_REDIRECT_URI: ${{ secrets.VITE_AZURE_REDIRECT_URI }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
        run: npx ng build --configuration production --base-href /song-site/

      - name: SPA fallback for deep links
        run: cp dist/song-site/browser/index.html dist/song-site/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/song-site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
